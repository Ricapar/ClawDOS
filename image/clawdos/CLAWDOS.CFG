# ClawDOS settings (C:\CLAWDOS\CLAWDOS.CFG). Lines are "key value"; # starts a
# comment except in key/keyfile lines; [name] starts an AI provider section.
# The image build fills in the tunnel address (build.py --tunnel) and the key
# (ANTHROPIC_API_KEY in .env). /model lists the providers and switches.

provider anthropic          # the [section] used at startup
theme claude                # claude or opencode
timezone 0                  # hours from UTC, for the clock set from the API
clock 1                     # set the DOS clock from the API at startup (0: leave it)
name Claude                 # {name} in PROMPT.TXT (a provider may override)

[anthropic]
type anthropic
tunnel 10.0.2.2:8443        # where the TLS tunnel listens (tunnel/tunnel.py)
host api.anthropic.com      # the Host header the tunnel's far end expects
path /v1/messages
model claude-opus-5-5
effort low
# key sk-ant-...            # or: keyfile C:\CLAWDOS\ANTHROP.KEY

# Another host that speaks the Messages API, reached through a second tunnel
# port: python3 tunnel/tunnel.py --map 8443=api.anthropic.com:443 --map 8444=openrouter.ai:443
#[openrouter]
#type anthropic
#tunnel 10.0.2.2:8444
#host openrouter.ai
#path /api/v1/messages
#auth bearer
#key sk-or-...
#model anthropic/claude-opus-5.5
