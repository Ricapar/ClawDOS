# ClawDOS settings (C:\CLAWDOS\CLAWDOS.CFG). Lines are "key value"; # starts a
# comment except in key/keyfile lines; [name] starts an AI provider section.
# The image build fills in the tunnel address (build.py --tunnel) and the key
# (ANTHROPIC_API_KEY in .env). /model lists the providers and switches.

provider anthropic          # the [section] used at startup
name Claude                 # {name} in PROMPT.TXT: the model behind ClawDOS;
                            # a provider section may set its own

[anthropic]
type anthropic
tunnel 10.0.2.2:8443        # where the TLS tunnel listens (tunnel/tunnel.py)
host api.anthropic.com      # the Host header the tunnel's far end expects
path /v1/messages
model claude-opus-5-5
effort low
# maxtokens 64000           # max_tokens, the most a reply may use, thinking
                            # included (64000 when there is no line)
progress 1                  # show the model's notes between tool calls (beta;
                            # 0 or no line: none asked for)
dropthinking 1              # if the prompt or tools change mid-chat, the API
                            # drops old thinking instead of failing (beta)
threads 1                   # message threads: after a chat's first request,
                            # send only what is new, not the whole chat (beta;
                            # 0 or no line: every request sends it all)
# cachettl 1h               # how long the prompt cache lasts: 5m (no line) or
                            # 1h (dearer to write; for long walk-aways)
# Chosen when a conversation starts and kept by it: an edit applies to the next
# one. /model to another [section] chooses them again from that section.
# Each is 0 or 1. If the API refuses one (a 400 naming a beta, "thinking" or
# "thread" on the first message), set it to 0.
# key sk-ant-...            # or: keyfile C:\CLAWDOS\ANTHROP.KEY
# auth tunnel               # instead of a key: the tunnel adds it (tunnel.py
                            # --key-file), so no key is kept on this disk

# Another host that speaks the Messages API, reached through a second tunnel
# port: python3 tunnel/tunnel.py --map 8443=api.anthropic.com:443 --map 8444=openrouter.ai:443
#[openrouter]
#type anthropic
#tunnel 10.0.2.2:8444
#host openrouter.ai
#path /api/v1/messages
#auth bearer
#key sk-or-...
#model anthropic/claude-opus-5.5
