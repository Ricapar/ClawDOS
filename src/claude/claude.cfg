/* mTCP compile-time configuration for CLAUDE.EXE (see mTCP's APPS/SAMPLE). */

#ifndef CONFIG_H
#define CONFIG_H

#define MTCP_PROGRAM_NAME "claude"

#include "Global.Cfg"

#define COMPILE_ARP
#define COMPILE_UDP
#define COMPILE_TCP
#define COMPILE_DNS
#define COMPILE_ICMP

#undef TCP_MAX_SOCKETS
#define TCP_MAX_SOCKETS (1)

/* One TCP connection that sends short lines: fewer buffers than mTCP's
   defaults leave more memory for programs run from CLAUDE, and the bridge
   never sends IP fragments, so there is no reassembly (8 KB of buffers). */
#undef PACKET_BUFFERS
#define PACKET_BUFFERS (8)
#undef TCP_MAX_XMIT_BUFS
#define TCP_MAX_XMIT_BUFS (5)

#endif
