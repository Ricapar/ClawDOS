/* mTCP compile-time configuration for HARNESS.EXE (see mTCP's APPS/SAMPLE). */

#ifndef CONFIG_H
#define CONFIG_H

#define MTCP_PROGRAM_NAME "claude"

/* No mTCP packet tracing (the DEBUGGING= environment variable): its strings
   and call sites cost about 10 KB of memory that stays resident while the run
   tool's programs execute. The mock API's log covers the requests. */
#define NOTRACE

#include "Global.Cfg"

#define COMPILE_ARP
#define COMPILE_UDP
#define COMPILE_TCP
#define COMPILE_DNS
#define COMPILE_ICMP

#undef TCP_MAX_SOCKETS
#define TCP_MAX_SOCKETS (1)

/* One TCP connection, whose requests go out in 512-byte pieces (lib/http.cpp's
   staging buffer, HTTP_TX_MAX): fewer transmit buffers than
   mTCP's defaults leave more memory for programs run from CLAWDOS, and the
   API never sends IP fragments, so there is no reassembly. Receive buffers
   stay above the default: on the real PC's WiFi, 8 overflowed (dropped
   packets, then long stalls while the far end backed off retransmitting). */
#undef PACKET_BUFFERS
#define PACKET_BUFFERS (12)
#undef TCP_MAX_XMIT_BUFS
#define TCP_MAX_XMIT_BUFS (5)

#endif
